name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # setup-go's built-in module cache uses the same GitHub Actions
          # cache API that's unreachable from a plain job container here —
          # see openremedy-client's release.yml for the full story. Hangs
          # instead of failing fast if left enabled.
          cache: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build .deb and .rpm (also produces the binary)
        run: ./packaging/build.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}" "deb rpm"

      - name: Stage tarball in dist/
        run: |
          tar -czf "dist/pgtuner_${{ steps.version.outputs.version }}_linux_${{ matrix.arch }}.tar.gz" pgtuner
          ls -lh dist/

      # v4 refuses to run against anything that isn't github.com (treats
      # Gitea as an unsupported GHES version) — v3 uses the older artifact
      # protocol Gitea Actions actually implements.
      - uses: actions/upload-artifact@v3
        with:
          name: artifacts-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # v3 has no merge-multiple — downloads each named artifact into its
      # own dist/<artifact-name>/ subdirectory instead of flattening.
      - uses: actions/download-artifact@v3
        with:
          path: dist

      - name: Flatten dist/ and list artefacts
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -lh dist/

      - name: Create Gitea release and upload assets
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          API="https://gitea.local.barrahome.org/api/v1/repos/OpenRemedy/pgtuner"
          TAG="${GITHUB_REF_NAME}"
          RELEASE_ID=$(curl -sf -H "Authorization: token $RELEASE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"$TAG\", \"generate_release_notes\": true}" \
            "$API/releases" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "created release id=$RELEASE_ID"
          for f in dist/*; do
            name="$(basename "$f")"
            echo "uploading $name"
            curl -sf -H "Authorization: token $RELEASE_TOKEN" \
              -F "attachment=@$f" \
              "$API/releases/$RELEASE_ID/assets?name=$name" > /dev/null
          done

  # Publish the freshly-released .deb into the dls.openremedy.io APT repo so
  # hosts can `apt upgrade pgtuner`. The signing GPG key never leaves the
  # VPS: this only SSHes in with a command-restricted key whose forced
  # command runs scripts/publish-deb.sh with the (validated) package+version
  # — it can do nothing else, so a leaked key can at worst re-publish an
  # existing release. Same org-level key openremedy-client uses.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish .deb to the APT repo on the VPS
        env:
          DLS_SSH_KEY_B64: ${{ secrets.DLS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$DLS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H app.openremedy.io >> ~/.ssh/known_hosts 2>/dev/null
          echo "Publishing pgtuner ${GITHUB_REF_NAME} to the APT repo..."
          ssh -i ~/.ssh/id_ci alberto@app.openremedy.io "pgtuner ${GITHUB_REF_NAME}"

  # Publish the freshly-released .rpm into the dls.openremedy.io dnf repo so
  # hosts can `dnf upgrade pgtuner`. Same command-restricted-key pattern.
  publish-rpm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish .rpm to the dnf repo on the VPS
        env:
          DLS_RPM_SSH_KEY_B64: ${{ secrets.DLS_RPM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$DLS_RPM_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H app.openremedy.io >> ~/.ssh/known_hosts 2>/dev/null
          echo "Publishing pgtuner ${GITHUB_REF_NAME} to the dnf repo..."
          ssh -i ~/.ssh/id_ci alberto@app.openremedy.io "pgtuner ${GITHUB_REF_NAME}"
