name: CI

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: pgtuner
          POSTGRES_PASSWORD: pgtuner
          POSTGRES_DB: pgtuner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgtuner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -tags integration ./...
        env:
          # "postgres" (the services key name), not localhost — on Gitea's
          # act_runner every job runs inside its own container, so the
          # service container is a sibling on the shared job network, not
          # reachable via the job's own localhost the way it would be on a
          # GitHub-hosted runner (which runs jobs bare on the VM and only
          # then port-maps services onto its real localhost).
          PGTUNER_TEST_DSN: postgres://pgtuner:pgtuner@postgres:5432/pgtuner
