name: pgtuner
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
section: admin
priority: optional
maintainer: Alberto Ferrer <albertof@barrahome.org>
homepage: https://github.com/soylic/pgtuner
license: Apache-2.0
description: |
  pgtuner is a PostgreSQL configuration tuning advisor.
  It connects to a running server, reads its settings and runtime
  statistics, and reports advice with a severity level for each item
  and an overall A-F grade.

contents:
  - src: ./pgtuner
    dst: /usr/local/bin/pgtuner
    file_info: { mode: 0755 }
  - src: ./README.md
    dst: /usr/share/doc/pgtuner/README.md
    file_info: { mode: 0644 }
  - src: ./LICENSE
    dst: /usr/share/doc/pgtuner/LICENSE
    file_info: { mode: 0644 }
